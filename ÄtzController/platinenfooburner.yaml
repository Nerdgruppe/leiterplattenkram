output:
  - platform: gpio
    pin: GPIO10
    id: spuelung_power
    inverted: True

hbridge:
  id: hbridge_controller
  a_high_side_pin: GPIO6
  a_low_side_pin: GPIO7
  b_high_side_pin: GPIO8
  b_low_side_pin: GPIO9

switch:
  - platform: template
    id: aetzvorgang
    name: ätzen
    optimistic: True
    on_turn_on: 
      then:
        - switch.turn_on: spuelung
        - logger.log: "Ätzen Start"
        - lambda: |-
            id(hbridge_controller).start(
              static_cast<uint32_t>(id(auftrag_time).state),
              static_cast<uint32_t>(id(abtrag_time).state),
              static_cast<uint32_t>(id(pause_time).state));
        - delay: !lambda "return id(run_time).state * 60000;"
        - logger.log: "Ätzen Zeit Ende"
        - switch.turn_off: aetzvorgang
    on_turn_off:
      then:
        - lambda: id(hbridge_controller).stop();
        - switch.turn_off: spuelung
  
  - platform: template
    id: spuelung
    name: spuelung
    optimistic: True
    #lambda: return id(spuelung_power);
    on_turn_on: 
      then:
        - output.turn_on: spuelung_power
    on_turn_off: 
      then:
        - output.turn_off: spuelung_power

number:
  - platform: template
    name: "Abtragzeit"
    id: abtrag_time
    optimistic: True
    min_value: 1
    max_value: 1000
    step: 1
    restore_value: True
    unit_of_measurement: us

  - platform: template
    name: "Auftragzeit"
    id: auftrag_time
    optimistic: True
    min_value: 1
    max_value: 1000
    step: 1
    restore_value: True
    unit_of_measurement: us

  - platform: template
    name: "Pausezeit"
    id: pause_time
    optimistic: True
    min_value: 1
    max_value: 1000
    step: 1
    restore_value: True
    unit_of_measurement: us

  - platform: template
    name: "Ätzzeit"
    id: run_time
    optimistic: True
    min_value: 1
    max_value: 60
    step: 1
    restore_value: True
    unit_of_measurement: min