#binary_sensor:
#  - platform: gpio
#    pin: GPIO1
#    id: Fussschalter
#    on_press: 
#      then:
#        - switch.toggle: aetzvorgang

output:
  - platform: gpio
    pin: GPIO6 
    id: abtrag_power
    inverted: True

  - platform: gpio
    pin: GPIO7
    id: reverse_power
    inverted: True

  - platform: gpio
    pin: GPIO8
    id: spuelung_power
    inverted: True

switch:
  - platform: template
    id: aetzvorgang
    name: ätzen
    optimistic: True
    on_turn_on: 
      then:
        - switch.turn_on: spuelung
        - logger.log: "Ätzen Start"
        - script.execute: aetzscript
        - delay: !lambda "return id(run_time).state * 60000;"
        - logger.log: "Ätzen Zeit Ende"
        - switch.turn_off: aetzvorgang
  
  - platform: template
    id: spuelung
    name: spuelung
    optimistic: True
    #lambda: return id(spuelung_power);
    on_turn_on: 
      then:
        - output.turn_on: spuelung_power
    on_turn_off: 
      then:
        - output.turn_off: spuelung_power

number:
  - platform: template
    name: "Abtragzeit"
    id: abtrag_time
    optimistic: True
    min_value: 1
    max_value: 1000
    step: 1
    restore_value: True
    unit_of_measurement: 'µs'

  - platform: template
    name: "Auftragzeit"
    id: auftrag_time
    optimistic: True
    min_value: 1
    max_value: 1000
    step: 1
    restore_value: True
    unit_of_measurement: 'µs'

  - platform: template
    name: "Pausezeit"
    id: pause_time
    optimistic: True
    min_value: 1
    max_value: 1000
    step: 1
    restore_value: True
    unit_of_measurement: 'µs'

  - platform: template
    name: "Ätzzeit"
    id: run_time
    optimistic: True
    min_value: 1
    max_value: 60
    step: 1
    restore_value: True
    unit_of_measurement: min


script:
  - id: aetzscript
    then:
    - while:
        condition:
          switch.is_on: aetzvorgang
        then:
          - lambda: |-
              uint32_t auftrag_us = (uint32_t)id(auftrag_time).state;
              uint32_t pause_us = (uint32_t)id(pause_time).state;
              uint32_t abtrag_us = (uint32_t)id(abtrag_time).state;

              auto reverse_p = id(reverse_power);
              auto abtrag_p = id(abtrag_power);

              // Auftrag phase (Reverse power ON)
              reverse_p->turn_on();
              delayMicroseconds(auftrag_us);
              reverse_p->turn_off();

              // Pause phase
              delayMicroseconds(pause_us);

              // Abtrag phase (Abtrag power ON)
              abtrag_p->turn_on();
              delayMicroseconds(abtrag_us);
              abtrag_p->turn_off();

              // Pause phase
              delayMicroseconds(pause_us);
    - if: 
        condition:
          - switch.is_off: aetzvorgang
        then:
          - switch.turn_off: spuelung
