#binary_sensor:
#  - platform: gpio
#    pin: GPIO1
#    id: Fussschalter
#    on_press: 
#      then:
#        - switch.toggle: aetzvorgang

output:
  - platform: gpio
    pin: GPIO6 
    id: abtrag_power
    inverted: True

  - platform: gpio
    pin: GPIO7
    id: reverse_power
    inverted: True

  - platform: gpio
    pin: GPIO8
    id: spuelung_power
    inverted: True

switch:
  - platform: template
    id: aetzvorgang
    name: ätzen
    optimistic: True
    on_turn_on: 
      then:
        - switch.turn_on: spuelung
        - logger.log: "Ätzen Start"
        - script.execute: aetzscript
        - delay: !lambda "return id(run_time).state * 60000;"
        - logger.log: "Ätzen Zeit Ende"
        - switch.turn_off: aetzvorgang
  
  - platform: template
    id: spuelung
    name: spuelung
    optimistic: True
    #lambda: return id(spuelung_power);
    on_turn_on: 
      then:
        - output.turn_on: spuelung_power
    on_turn_off: 
      then:
        - output.turn_off: spuelung_power

number:
  - platform: template
    name: "Abtragzeit"
    id: abtrag_time
    optimistic: True
    min_value: 1
    max_value: 1000
    step: 1
    restore_value: True
    unit_of_measurement: "µs"

  - platform: template
    name: "Auftragzeit"
    id: auftrag_time
    optimistic: True
    min_value: 1
    max_value: 1000
    step: 1
    restore_value: True
    unit_of_measurement: "µs"

  - platform: template
    name: "Pausezeit"
    id: pause_time
    optimistic: True
    min_value: 1
    max_value: 1000
    step: 1
    restore_value: True
    unit_of_measurement: "µs"

  - platform: template
    name: "Ätzzeit"
    id: run_time
    optimistic: True
    min_value: 1
    max_value: 60
    step: 1
    restore_value: True
    unit_of_measurement: min


script:
  - id: aetzscript
    mode: single
    then:
      - lambda: |-
          const uint32_t auftrag_us = static_cast<uint32_t>(id(auftrag_time).state);
          const uint32_t abtrag_us = static_cast<uint32_t>(id(abtrag_time).state);
          const uint32_t pause_us = static_cast<uint32_t>(id(pause_time).state);

          auto wait_us = [](uint32_t us) {
            if (us == 0)
              return;
            const int64_t start = esp_timer_get_time();
            while (esp_timer_get_time() - start < us) {
              // Busy-wait loop with direct ESP32 timer polling.
              // This avoids the scheduler-based 1 ms delay ceiling.
            }
          };

          while (id(aetzvorgang).state) {
            id(reverse_power).turn_on();
            wait_us(auftrag_us);
            id(reverse_power).turn_off();

            wait_us(pause_us);

            id(abtrag_power).turn_on();
            wait_us(abtrag_us);
            id(abtrag_power).turn_off();

            wait_us(pause_us);
          }

      - if:
          condition:
            - switch.is_off: aetzvorgang
          then:
            - switch.turn_off: spuelung